# About our dataset

---

# Mental health inpatient activity

- Data from "Public Health Scotland"

--

- Consists of 14 files containing information on patients with mental health problems

--

- All patients had been cared for as inpatient or day cases in Scottish general and psychiatric hospitals for all NHS Boards or residence and treatment

--

- Period covered is financial years 1997/98 - 2021/22

--

- We chose this dataset because there were many variables that could be linked together and we knew there would be many different questions and relationships to analyse

--

- During the first workshop, we saw we could link datasets by diagnosis, since it will exclude any patients with missing diagnosis, and also provide the patients' characteristics.

- From this, we began brainstorming research questions

---

#Brainstorming research questions

- During the first workshop, we saw we could link datasets by diagnosis, since it will exclude any patients with missing diagnosis, and also provide the patients' characteristics.

- Different factors/relationships to look at:

 - age, sex, diagnosis, frequency of stay, number of admissions
 
 - compare between two finacial years, or between two regions
  
--

- Initial questions

 - How has treatment for mental health changed between 1997/98 and 2021/22?
 
 - Has the ratio of male and females changed over the years?
 
 - Has awareness of mental health changed over time?
 
 - How has the length of stay changed over time?
